name: Check Spelling Node

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  cspell:
    name: Spell Check Typst
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install CSpell and Italian Dictionary
        run: |
          npm install cspell @cspell/dict-it-it

      - name: Run CSpell
        run: |
          npx cspell "**/*.typ" "!**/template_*.typ"