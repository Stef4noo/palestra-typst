name: Check Spelling Node

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  cspell:
    name: Spell Check Typst
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check spelling with CSpell
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: 'cspell.json'
          incremental_files_only: false
          suggestions: true
          files: |
            **/*.typ
            !**/template_*.typ         

      - name: Run CSpell explicitly
        run: |
          # Stampa i file trovati per debug visivo nei log di GitHub
          echo "=== File .typ trovati nella repository ==="
          find . -name "*.typ"
          
          echo "=== Esecuzione CSpell ==="
          npx cspell "**/*.typ" "!**/template_*.typ" --config cspell.json