name: Check Spelling

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # Permette l'avvio manuale dalla scheda "Actions" di GitHub
  workflow_dispatch:

jobs:
  cspell:
    name: Spell Check Typst
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run CSpell
        run: |
          npx cspell "**/*.typ"