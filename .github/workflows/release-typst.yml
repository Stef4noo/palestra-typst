name: Build and release Typst PDF

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Generate Timestamp
        id: timestamp
        run: |
          # Generate a clean timestamp (e.g., 2026-11-05_21-25-00)
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "tag=release-$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Compile PDF
        run: |
          mkdir -p dist
          
          # Recursively find all main.typ files inside subfolders of src/
          find src -name "main.typ" | while read -r file; do
            # Extract the immediate parent directory name of the main.typ file
            subfolder=$(basename "$(dirname "$file")")
            
            echo "Compiling: $file -> dist/${subfolder}.pdf"
            typst compile "$file" "dist/${subfolder}.pdf"
          done

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.timestamp.outputs.tag }}
          name: Release ${{ env.TIMESTAMP }}
          allowUpdates: false
          replacesArtifacts: false
          artifacts: dist/*.pdf
